name: SpellLegacy
version: '${project.version}'
main: portal15.spelllegacy.SpellLegacy
api-version: '1.20'
authors: [portal15]
depend: [ProtocolLib]
description: SpellLegacy - adds some magic!
commands:
  mySpells:
    description: Display your learned spells.
    usage: /<command>
  learn:
    description: Learn a spell.
    usage: /<command> <Spell> [Player]
    permission: spelllegacy.learn
    permission-message: "You don't have permission to use this command. Please ask an admin."
  unLearn:
    description: Unlearn a spell.
    usage: /<command> [spell
    permission: spelllegacy.unlearn
    permission-message: "You don't have permission to use this command. Please ask an admin."
  selectSpells:
    description: Select the spells you want to use.
    usage: /<command> [Spell] [Spell] [Spell]
  adminMenu:
    description: Open the admin menu.
    usage: /<command>
    permission: spelllegacy.admin
    permission-message: "You don't have permission to use this command. Please ask an admin."
  test:
    description: Test command.
  safeReload:
    description: Reload the plugin without losing data.
    usage: /<command>
    permission: spelllegacy.reload
    permission-message: "You don't have permission to use this command. Please ask an admin."